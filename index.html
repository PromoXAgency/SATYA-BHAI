<title>[SATYA_BHAI_2022]™</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  background:#0b0b0f;
  color:white;
  overflow-x:hidden;
}

/* HERO WITH BACKGROUND IMAGE */
.hero{
  background: linear-gradient(rgba(106,17,203,0.7), rgba(142,45,226,0.7)),
              url('https://i.postimg.cc/Fs2mMXQX/6088900867424717898.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  padding:60px 20px;
  position:relative;
  overflow:hidden;
}

/* BLUR EFFECT */
.hero::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  backdrop-filter: blur(4px);
}

/* TEXT */
.hero h1{
  font-size:50px;
  font-weight:900;
  letter-spacing:2px;
  animation:slideIn 1s ease;
  position:relative;
  z-index:2;
}

.hero h2{
  font-size:28px;
  opacity:0.9;
  margin-top:-10px;
  animation:slideIn 1.2s ease;
  position:relative;
  z-index:2;
}

@keyframes slideIn{
  from{
    transform:translateY(50px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* PROFILE IMAGE */
.profile{
  position:absolute;
  right:20px;
  top:50px;
  width:100px;
  border-radius:20px;
  transform:rotate(8deg);
  animation:fadeIn 1.5s ease;
  z-index:2;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

/* FEATURES */
.features{
  display:flex;
  gap:10px;
  padding:20px;
  overflow-x:auto;
}

.feature{
  padding:10px 18px;
  border-radius:25px;
  background:rgba(255,255,255,0.05);
  border:1px solid #8e2de2;
  font-size:14px;
  transition:0.3s;
}

.feature:hover{
  background:#8e2de2;
}

/* CARDS */
.card{
  background:#15151c;
  margin:15px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  animation:fadeUp 1s ease;
}

@keyframes fadeUp{
  from{
    transform:translateY(40px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* BARS */
.bar{
  height:8px;
  background:#222;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#8e2de2,#c471f5);
  border-radius:10px;
  animation:fillAnim 2s forwards;
}

@keyframes fillAnim{
  from{width:0;}
}

/* BUTTON */
.btn{
  display:block;
  margin:30px auto;
  width:90%;
  text-align:center;
  padding:18px;
  font-size:18px;
  font-weight:bold;
  border-radius:15px;
  background:linear-gradient(90deg,#7b2ff7,#f107a3);
  text-decoration:none;
  color:white;
  position:relative;
  overflow:hidden;
  animation:pulse 1.5s infinite;
}

.btn::before{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.2);
  top:0;
  left:-100%;
  transition:0.5s;
}

.btn:hover::before{
  left:100%;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

</style>
</head>

<body>

<div class="hero">

</div>

<div class="features">
  <div class="feature">Daily Tips</div>
  <div class="feature">Expert Picks</div>
  <div class="feature">Live Alerts</div>
</div>

  </div>
</div>

<div class="card">

  </div>
</div>

</div>
